<style>
  /* Layout: a menu board under a striped bucket band. One column, list rows with
     big prices on the right; the budget result prints as a till receipt. */
  :root {
    --red: #d7001f;       /* bucket red: band, bars, active controls */
    --red-ink: #b8001b;   /* red as text on the page background */
    --yellow: #ffcc00;    /* price-tag yellow: top ranks, promo tags */
    --ink: #1c1416;
    --muted: #6f6164;     /* red-biased grey */
    --bg: #ffffff;
    --surface: #f7f1f1;
    --line: #eadfe0;
    --good: #0d7a3c;
    --good-bg: #ddf3e5;
    --paper: #fffdf7;     /* receipt stays paper in both themes */
    --paper-ink: #231c1d;
    --on-red: #ffffff;
    --on-yellow: #1c1416;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --red: #e3132f; --red-ink: #ff6377; --yellow: #ffd23f; --ink: #f6efef; --muted: #ab9b9e;
      --bg: #141011; --surface: #1f191a; --line: #322829; --good: #52d690; --good-bg: #143322;
      --paper: #f3eee4; --paper-ink: #231c1d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --red: #e3132f; --red-ink: #ff6377; --yellow: #ffd23f; --ink: #f6efef; --muted: #ab9b9e;
    --bg: #141011; --surface: #1f191a; --line: #322829; --good: #52d690; --good-bg: #143322;
    --paper: #f3eee4; --paper-ink: #231c1d; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- band ---- */
  .band { background: var(--red); color: var(--on-red); padding-top: env(safe-area-inset-top, 0px); }
  .stripes { height: 14px; background: repeating-linear-gradient(90deg, var(--on-red) 0 22px, var(--red) 22px 44px); }
  .band .wrap { padding-block: 18px 22px; display: grid; gap: 10px; }
  .band-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .stamp { font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .lang { display: flex; border: 2px solid var(--on-red); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: transparent; padding: 4px 11px; font: 800 12px/1.2 var(--font-display); cursor: pointer; color: var(--on-red); }
  .lang button[aria-pressed="true"] { background: var(--on-red); color: var(--red); }
  h1 { margin: 0; font: 900 clamp(30px, 9vw, 52px)/0.95 var(--font-display); letter-spacing: -0.02em; text-transform: uppercase; text-wrap: balance; }
  .tagline { margin: 0; font-size: 16px; font-weight: 500; max-width: 46ch; text-wrap: balance; }

  /* ---- tabs ---- */
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--ink); }
  .tabs .wrap { display: flex; }
  .tabs button { flex: 1; border: 0; background: none; padding: 14px 4px 11px; font: 800 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; cursor: pointer; color: var(--muted); border-bottom: 4px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

  main.wrap { padding-block: 18px 40px; }
  .controls { display: grid; gap: 10px; margin-bottom: 16px; }
  .seg { display: flex; background: var(--surface); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .search { width: 100%; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .search:focus { border-color: var(--ink); outline: none; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--red); margin: 0; }

  /* ---- rankings ---- */
  .board { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .rk { font: 800 15px/28px var(--font-display); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .rk.top { background: var(--yellow); color: var(--on-yellow); border-radius: 50%; width: 28px; height: 28px; font-size: 13px; }
  .nm { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
  .lb { font-weight: 500; color: var(--muted); }
  .mt { font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tags { display: inline-flex; gap: 4px; vertical-align: 2px; margin-left: 2px; }
  .tag { font: 700 11px/1 var(--font-body); padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .tag.promo { background: var(--yellow); color: var(--on-yellow); }
  .tag.bonus { background: var(--good-bg); color: var(--good); }
  .side { text-align: right; display: grid; gap: 2px; justify-items: end; }
  .pr { font: 800 18px/1.1 var(--font-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pr s { font: 500 13px var(--font-body); color: var(--muted); margin-right: 5px; }
  .vl { color: var(--red-ink); white-space: nowrap; font-variant-numeric: tabular-nums; display: grid; justify-items: end; }
  .vl b { font: 800 17px/1.2 var(--font-display); }
  .vl small { font: 600 11px/1.2 var(--font-body); }
  .bar { grid-column: 2 / -1; height: 5px; background: var(--surface); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--red); border-radius: 3px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---- combos ---- */
  .combos { display: grid; gap: 14px; }
  .combo { border: 2px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
  .combo.muted { border-color: var(--line); }
  .c-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .c-name { font: 800 16px/1.25 var(--font-display); text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
  .c-short { font-size: 14px; color: var(--muted); }
  .deal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { font: 700 13px/1 var(--font-body); padding: 6px 9px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.good { background: var(--good-bg); color: var(--good); }
  .chip.bad { background: var(--surface); color: var(--red-ink); }
  .note { font-size: 13px; color: var(--muted); }
  .picks { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 4px; font-size: 14px; }
  .picks span { color: var(--muted); }
  .ticket { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--yellow); color: var(--on-yellow); border-radius: 10px; padding: 8px 12px; position: relative; }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--bg); }
  .ticket::before { left: -7px; } .ticket::after { right: -7px; }
  .ticket small { font-size: 12px; font-weight: 600; }
  .ticket b { font: 700 24px/1 var(--font-mono); letter-spacing: .12em; }

  /* ---- budget ---- */
  .budget { display: grid; gap: 12px; margin-bottom: 22px; }
  .money { display: flex; align-items: baseline; gap: 8px; border-bottom: 4px solid var(--ink); }
  .money { position: relative; }
  .money input, .money .mirror { font: 900 clamp(40px, 13vw, 64px)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
  .money input { width: 3.4ch; max-width: 100%; min-width: 0; border: 0; background: none; padding: 0; -moz-appearance: textfield; }
  .money .mirror { position: absolute; visibility: hidden; white-space: pre; font-style: normal; }
  .money input::-webkit-inner-spin-button, .money input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .money input:focus { outline: none; }
  .money span { font: 900 clamp(28px, 9vw, 44px)/1 var(--font-display); color: var(--muted); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick button { border: 2px solid var(--line); background: none; border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
  .quick button:hover { border-color: var(--ink); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .stepper { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  .stepper input { width: 52px; border: 2px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 6px; text-align: center; font-weight: 700; }

  .receipt { position: relative; background: var(--paper); color: var(--paper-ink); font: 500 13px/1.5 var(--font-mono); padding: 22px 20px 26px; max-width: 420px; margin: 0 auto 18px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0, 0, 0, .5); }
  .receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px; background: linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 10px repeat-x, linear-gradient(225deg, var(--paper) 50%, transparent 50%) 0 0 / 14px 10px repeat-x; }
  .r-head { text-align: center; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .r-sub { text-align: center; opacity: .65; font-size: 12px; }
  .r-rule { border: 0; border-top: 1px dashed currentColor; opacity: .45; margin: 12px 0; }
  .r-line { display: flex; justify-content: space-between; gap: 12px; }
  .r-line span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .r-line span:last-child { white-space: nowrap; }
  .r-note { opacity: .6; font-size: 12px; padding-left: 2ch; margin-bottom: 4px; overflow-wrap: anywhere; }
  .r-total { font-weight: 700; font-size: 16px; }
  .r-big { text-align: center; margin-top: 4px; }
  .r-big b { display: block; font: 900 30px/1.1 var(--font-display); letter-spacing: -0.01em; }

  /* ---- footer ---- */
  footer { border-top: 2px solid var(--ink); }
  footer .wrap { padding-block: 18px 36px; display: grid; gap: 10px; font-size: 13px; color: var(--muted); }
  footer p { margin: 0; max-width: 65ch; }
  footer b { color: var(--ink); }
  footer a { color: var(--red-ink); font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    .bar i { transition: width .3s ease-out; }
  }
</style>

</main>

</footer>

/* ---------- rankings ---------- */
function renderRank() {
  const m = METRICS[state.metric];

/* ---------- combos ---------- */
// Pick `g.pick` options per slot, best first by `score`.
function choose(combo, score) {
  return combo.groups.map(g => {
    const opts = [...g.options].sort((a, b) => score(b) - score(a) || (b.standalone ?? 0) - (a.standalone ?? 0));
    return { group: g, chosen: opts.slice(0, g.pick) };
  });
}

function comboDeal(c) {
  const picks = choose(c, o => o.standalone ?? -1);
  const parts = picks.flatMap(p => p.chosen);
  const priced = parts.every(o => o.standalone != null);
  const separately = parts.reduce((s, o) => s + (o.standalone ?? 0), 0);
  return { picks, priced, separately, save: separately - c.price };
}

function renderCombos() {
  const rows = DATA.combos
    .filter(c => !state.couponsOnly || c.code)
    .map(c => ({ c, d: comboDeal(c) }))
    .sort((a, b) => (b.d.priced - a.d.priced) ||
      (state.comboSort === "sortRub" ? b.d.save - a.d.save : b.d.save / b.d.separately - a.d.save / a.d.separately));
  $("combo-list").innerHTML = rows.map(({ c, d }) => {
    const pct = Math.round(d.save / d.separately * 100);
    const choices = d.picks.filter(p => p.group.options.length > p.group.pick);
    const deal = !d.priced ? `<span class="note">${t("noCompare")}</span>`
      : d.save >= 0 ? `<span class="chip good">${t("save")(rub(d.save), pct)}</span>`
      : `<span class="chip bad">${t("lose")(rub(-d.save))}</span>`;
    return `<article class="combo${d.priced && d.save > 0 ? "" : " muted"}">
      <div class="c-head">
        <div class="c-name">${esc(comboName(c))}</div>
        <div class="pr">${d.priced && d.save > 0 ? `<s>${num(Math.round(d.separately))}</s>` : ""}${rub(c.price)}</div>

/* ---------- budget optimiser: 0/1 knapsack over item copies, with a has-drink flag ---------- */
function candidates(metric, allowCombos) {
  const m = METRICS[metric];
  const out = DATA.items
    .filter(it => it.known && it.price > 0)
    .map(it => ({ name: it.name, label: it.label, price: Math.ceil(it.price), value: m.get(it), drink: isDrink(it), parts: null }));
  if (allowCombos) {
    for (const c of DATA.combos) {
      const picks = choose(c, o => m.get(o));
      const parts = picks.flatMap(p => p.chosen);
      out.push({
        name: comboName(c), label: "", price: Math.ceil(c.price),
        value: parts.reduce((s, o) => s + m.get(o), 0),
        drink: parts.some(o => o.ml > 0),
        parts: picks.filter(p => p.group.options.length > p.group.pick).flatMap(p => p.chosen.map(o => o.name)),
      });
    }
  }
  return out.filter(x => x.value > 0 || x.drink);
}

function optimise(budget, metric, copies, needDrink, allowCombos) {
  const items = candidates(metric, allowCombos).flatMap(x => Array.from({ length: copies }, () => x));
  const B = budget, W = B + 1, n = items.length;
  // dp[f*W + b] = best value spending at most b; f = 1 once a drink is in the order
  let dp = new Float64Array(2 * W).fill(-Infinity);
  for (let b = 0; b <= B; b++) dp[b] = 0;
  const take = new Uint8Array(n * 2 * W);
  for (let i = 0; i < n; i++) {
    const { price, value, drink } = items[i];
    const next = dp.slice();
    for (let f = 0; f < 2; f++) {
      const nf = drink ? 1 : f;
      for (let b = price; b <= B; b++) {
        const cand = dp[f * W + b - price] + value;
        if (cand > next[nf * W + b]) { next[nf * W + b] = cand; take[i * 2 * W + nf * W + b] = 1 + f; }
      }
    }
    dp = next;
  }
  let f = needDrink ? 1 : (dp[W + B] > dp[B] ? 1 : 0), b = B;
  if (dp[f * W + b] === -Infinity) return null;
  const chosen = [];
  for (let i = n - 1; i >= 0; i--) {
    const tk = take[i * 2 * W + f * W + b];
    if (tk) { chosen.push(items[i]); b -= items[i].price; f = tk - 1; }
  }
  return chosen;
}

  const m = METRICS[state.bMetric];
  const copies = Math.min(5, Math.max(1, Math.floor(+$("b-copies").value || 1)));
  const chosen = optimise(budget, state.bMetric, copies, $("b-drink").checked, $("b-combos").checked);
  if (!chosen || !chosen.length) {
    $("b-out").innerHTML = `<div class="empty">${t("cantBuy")}</div>`;
    return;
  }
  const groups = new Map();
  for (const x of chosen) groups.set(x, (groups.get(x) || 0) + 1);
  const spent = chosen.reduce((s, x) => s + x.price, 0);
  const total = chosen.reduce((s, x) => s + x.value, 0);
  const lines = [...groups].sort((a, b) => b[0].price * b[1] - a[0].price * a[1]).map(([x, n]) => `
    <div class="r-line"><span>${n > 1 ? `${n}× ` : ""}${esc(x.name)}${x.label ? ` ${esc(x.label)}` : ""}</span><span>${rub(x.price * n)}</span></div>
    ${x.parts && x.parts.length ? `<div class="r-note">${x.parts.map(esc).join(" + ")}</div>` : ""}`).join("");
  $("b-out").innerHTML = `<div class="receipt">
    <div class="r-head">${t("receipt")}</div>
    <div class="r-sub">${new Date().toLocaleDateString(state.lang === "ru" ? "ru-RU" : "en-GB")}</div>
    <hr class="r-rule">
    ${lines}
    <hr class="r-rule">
    <div class="r-line r-total"><span>${t("total")}</span><span>${rub(spent)}</span></div>
    <div class="r-line"><span>${t("change")}</span><span>${rub(budget - spent)}</span></div>
    <hr class="r-rule">
    <div class="r-big"><b>${num(total, m.digits)} ${t(m.unit)}</b>${num(total / spent * 100, m.digits)} ${t(m.unit)} ${t("perRub")}</div>
  </div>`;
}

/* ---------- wiring ---------- */
function openTab(tab) {
  if (!TABS.includes(tab)) tab = "rank";
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  TABS.forEach(id => $(`view-${id}`).hidden = id !== tab);
  if (tab === "budget") renderBudget();
}

function setLang(lang) {
  state.lang = lang;
  savePref("lang", lang);
  document.documentElement.lang = lang;
  document.title = I18N[lang].title;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  $("stamp").textContent = t("stamp")(new Date(DATA.captured).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "short", year: "numeric" }));
  seg($("metric"), Object.keys(METRICS), "metric", renderRank);
  seg($("scope"), ["food", "drinks", "all"], "scope", renderRank);
  seg($("combo-sort"), ["sortRub", "sortPct"], "comboSort", renderCombos);
  seg($("b-metric"), Object.keys(METRICS), "bMetric", renderBudget);
  $("b-quick").innerHTML = [300, 500, 1000, 2000].map(v => `<button type="button" data-v="${v}">${num(v)} ₽</button>`).join("");
  renderRank();
  renderCombos();
  if (!$("view-budget").hidden) renderBudget();
}

document.querySelector(".lang").onclick = e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.lang); };
document.querySelector(".tabs").onclick = e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  history.replaceState(null, "", `#${b.dataset.tab}`);
  openTab(b.dataset.tab);
};
window.addEventListener("hashchange", () => openTab(location.hash.slice(1)));
$("q").oninput = e => { state.q = e.target.value; renderRank(); };
$("coupons-only").onchange = e => { state.couponsOnly = e.target.checked; renderCombos(); };
$("b-quick").onclick = e => { const b = e.target.closest("button"); if (b) { $("b-money").value = b.dataset.v; renderBudget(); } };
["b-money", "b-copies", "b-drink", "b-combos"].forEach(id => $(id).addEventListener("input", renderBudget));

setLang(loadPref("lang") ||(/^(ru|uk|be|kk)\b/i.test(navigator.language || "") ? "ru" : "en"));
openTab(location.hash.slice(1));
document.fonts?.ready.then(fitMoney);
</script>
